title: Releases
description: >- # this means to ignore newlines until "baseurl:"
  Upcoming movie & series releases.
baseurl: "/releases" # the subpath of your site, e.g. /blog
url: "https://jasoncoon.github.io" # the base hostname & protocol for your site, e.g. http://example.com
author:
  name: Jason Coon

# Build settings
theme: minima
minima:
  skin: dark
  hide_site_feed_link: true
  social_links:
    - { url: "https://github.com/jasoncoon/releases", icon: github, title: GitHub }
